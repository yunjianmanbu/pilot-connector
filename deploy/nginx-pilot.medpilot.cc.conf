# Pilot 官网：HTML 不做强缓存，静态资源按版本参数长期缓存。
map $uri $pilot_cache_control {
    default "";
    ~*\.html$ "no-cache, must-revalidate";
    ~/$ "no-cache, must-revalidate";
}

server
{
    listen 80;
    server_name pilot.medpilot.cc;
    root /www/wwwroot/pilot.medpilot.cc;

    # Let's Encrypt 续签仍需走 HTTP-01
    location ^~ /.well-known/acme-challenge/ {
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/pilot.medpilot.cc.log;
    error_log /www/wwwlogs/pilot.medpilot.cc.error.log;
}

server
{
    listen 443 ssl http2;
    server_name pilot.medpilot.cc;
    root /www/wwwroot/pilot.medpilot.cc;
    index index.html;

    ssl_certificate    /www/server/panel/vhost/letsencrypt/pilot.medpilot.cc/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/letsencrypt/pilot.medpilot.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $pilot_cache_control always;

    # Pilot Link 云端连接器：只转发端到端加密的 WebSocket 帧。
    location = /connector {
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        access_log off;
    }

    # Service worker must be revalidated so PWA updates land promptly.
    location = /app/sw.js {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|jpeg|svg|webp|ico)$ {
        expires 30d;
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        access_log off;
    }

    access_log /www/wwwlogs/pilot.medpilot.cc.log;
    error_log /www/wwwlogs/pilot.medpilot.cc.error.log;
}
