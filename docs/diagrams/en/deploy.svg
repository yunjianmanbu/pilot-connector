<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="344" viewBox="0 0 1040 344" role="img" aria-label="Three ways to run the connector">
<title>Three ways to run the connector</title>
<style>text{font-family:-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;}.mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,monospace;}</style>
<rect width="1040" height="344" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">Three ways to run the connector</text>
<text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">One program, one config file; the admission rules never change</text>
<rect x="40" y="96" width="306" height="150" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="62" y="126" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">SAME LAN</text><line x1="62" y1="140" x2="324" y2="140" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="62" y="176" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">no relay process at all,</text><text x="62" y="198" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">the two ends connect directly</text><rect x="367" y="96" width="306" height="150" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="389" y="126" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">YOUR RELAY</text><line x1="389" y1="140" x2="651" y2="140" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="389" y="176" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">PORT / BIND / WS_PATH, then</text><text x="389" y="198" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">it forwards by room only</text><rect x="694" y="96" width="306" height="150" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="716" y="126" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">BEHIND NGINX</text><line x1="716" y1="140" x2="978" y2="140" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="716" y="176" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">a location block upgrades</text><text x="716" y="198" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">wss to 127.0.0.1:8789</text><rect x="40" y="268" width="960" height="56" rx="14" fill="#081018" stroke="rgba(123,240,208,0.32)" stroke-width="1.2"/><text x="60" y="302" font-size="12" fill="#7bf0d0" font-weight="400" text-anchor="start">Admission is identical in all three: signed ticket, one owner per room, per-IP cap, redacted logs.</text>
</svg>
