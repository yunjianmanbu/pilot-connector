<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="346" viewBox="0 0 1040 346" role="img" aria-label="Two faces of a blind relay: every field is client-chosen">
<title>Two faces of a blind relay: every field is client-chosen</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#6f8b96"/>
</marker>
</defs>
<style>
text{font-family:undefined;}
.mono{font-family:"JetBrains Mono","Cascadia Code","SFMono-Regular",Consolas,monospace;}
</style>
<rect width="1040" height="346" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">Two faces of a blind relay: every field is client-chosen</text><text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">relay.hello { role, room, key } → relay.ready { role, protocol }</text><rect x="40" y="88" width="300" height="148" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="64" cy="115" r="4" fill="#f3bd5a"/><text x="78" y="120" font-size="14.5" fill="#e9f4f4" font-weight="600" text-anchor="start">Client (desktop / phone)</text><text x="62" y="156" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">room picked by the caller</text><text x="62" y="179" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">key picked by the caller</text><text x="62" y="202" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">role declared by the caller</text><rect x="380" y="88" width="300" height="148" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="404" cy="115" r="4" fill="#4fb6f0"/><text x="418" y="120" font-size="14.5" fill="#e9f4f4" font-weight="600" text-anchor="start">Relay (blind forwarding)</text><text x="402" y="156" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">only check: same room id</text><text x="402" y="179" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">key must match the earlier one</text><text x="402" y="202" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">no content, no storage</text><rect x="720" y="88" width="300" height="148" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="744" cy="115" r="4" fill="#ff6b6b"/><text x="758" y="120" font-size="14.5" fill="#e9f4f4" font-weight="600" text-anchor="start">A stranger</text><text x="742" y="156" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">needs only the wss:// address</text><text x="742" y="179" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">opens his own room, acts as host</text><text x="742" y="202" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">your bandwidth, your port</text><path d="M342 162 L376 162" stroke="rgba(154,202,218,0.45)" stroke-width="1.4" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><path d="M682 162 L716 162" stroke="rgba(154,202,218,0.45)" stroke-width="1.4" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><rect x="40" y="258" width="960" height="64" rx="14" fill="#081018" stroke="rgba(243,189,90,0.35)" stroke-width="1.2"/><text x="60" y="283" font-size="13.5" fill="#f3bd5a" font-weight="400" text-anchor="start">The price: it cannot read content, so it cannot tell whether a connection belongs to its owner.</text><text x="60" y="306" font-size="13.5" fill="#f3bd5a" font-weight="400" text-anchor="start">What is missing is not a smarter relay but a verifiable token attached to &quot;allowed&quot;.</text>
</svg>
