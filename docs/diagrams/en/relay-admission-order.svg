<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="456" viewBox="0 0 1040 456" role="img" aria-label="The refusal happens before resources are allocated">
<title>The refusal happens before resources are allocated</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#6f8b96"/>
</marker>
</defs>
<style>
text{font-family:undefined;}
.mono{font-family:"JetBrains Mono","Cascadia Code","SFMono-Regular",Consolas,monospace;}
</style>
<rect width="1040" height="456" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">The refusal happens before resources are allocated</text><text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">One exit for every refusal: send relay.error, then close with 4009</text><rect x="112" y="88" width="888" height="66" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="72" cy="121" r="16" fill="#081018" stroke="#708993" stroke-width="1.4"/><text class="mono" x="72" y="126" font-size="13" fill="#708993" font-weight="600" text-anchor="middle">1</text><text x="136" y="115" font-size="13.5" fill="#e9f4f4" font-weight="600" text-anchor="start">HTTP 101 upgrade completes</text><text x="136" y="137" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">no status codes afterwards; 401 only matters before that</text><rect x="112" y="168" width="888" height="66" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="72" cy="201" r="16" fill="#081018" stroke="#4fb6f0" stroke-width="1.4"/><text class="mono" x="72" y="206" font-size="13" fill="#4fb6f0" font-weight="600" text-anchor="middle">2</text><text x="136" y="195" font-size="13.5" fill="#e9f4f4" font-weight="600" text-anchor="start">relay.hello arrives</text><text x="136" y="217" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">any socket that got this far is already speaking WebSocket</text><rect x="112" y="248" width="888" height="66" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="72" cy="281" r="16" fill="#081018" stroke="#ff6b6b" stroke-width="1.4"/><text class="mono" x="72" y="286" font-size="13" fill="#ff6b6b" font-weight="600" text-anchor="middle">3</text><text x="136" y="275" font-size="13.5" fill="#e9f4f4" font-weight="600" text-anchor="start">Verify the signature (pure computation)</text><text x="136" y="297" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">on failure → relay.error + close(4009), one display path</text><rect x="112" y="328" width="888" height="66" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="72" cy="361" r="16" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="72" y="366" font-size="13" fill="#7bf0d0" font-weight="600" text-anchor="middle">4</text><text x="136" y="355" font-size="13.5" fill="#e9f4f4" font-weight="600" text-anchor="start">createRoom</text><text x="136" y="377" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">the check must come first; one step later it takes a slot then returns it</text><text x="40" y="432" font-size="13" fill="#f3bd5a" font-weight="400" text-anchor="start">Why the order matters: refuse one step late and capacity accounting means nothing.</text>
</svg>
