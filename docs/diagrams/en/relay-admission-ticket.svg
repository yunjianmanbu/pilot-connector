<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="406" viewBox="0 0 1040 406" role="img" aria-label="One ticket = four fields + one HMAC">
<title>One ticket = four fields + one HMAC</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#6f8b96"/>
</marker>
</defs>
<style>
text{font-family:undefined;}
.mono{font-family:"JetBrains Mono","Cascadia Code","SFMono-Regular",Consolas,monospace;}
</style>
<rect width="1040" height="406" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">One ticket = four fields + one HMAC</text><text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">Signed by the desktop (it already holds the pairing secret) · verified, never stored</text><rect x="40" y="88" width="445" height="210" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text class="mono" x="62" y="122" font-size="12.5" fill="#e9f4f4" font-weight="400" text-anchor="start">ticket = {</text><text class="mono" x="84" y="148" font-size="12.5" fill="#4fb6f0" font-weight="400" text-anchor="start">id</text><text class="mono" x="132" y="148" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">:</text><text class="mono" x="144" y="148" font-size="12.5" fill="#e9f4f4" font-weight="400" text-anchor="start">&quot;home&quot;</text><text class="mono" x="268" y="148" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">// which key</text><text class="mono" x="84" y="174" font-size="12.5" fill="#4fb6f0" font-weight="400" text-anchor="start">room</text><text class="mono" x="132" y="174" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">:</text><text class="mono" x="144" y="174" font-size="12.5" fill="#e9f4f4" font-weight="400" text-anchor="start">&quot;9f3a2c7e18b4&quot;</text><text class="mono" x="268" y="174" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">// bound room</text><text class="mono" x="84" y="200" font-size="12.5" fill="#4fb6f0" font-weight="400" text-anchor="start">exp</text><text class="mono" x="132" y="200" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">:</text><text class="mono" x="144" y="200" font-size="12.5" fill="#e9f4f4" font-weight="400" text-anchor="start">1763700000</text><text class="mono" x="268" y="200" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">// lifetime</text><text class="mono" x="84" y="226" font-size="12.5" fill="#4fb6f0" font-weight="400" text-anchor="start">mac</text><text class="mono" x="132" y="226" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">:</text><text class="mono" x="144" y="226" font-size="12.5" fill="#e9f4f4" font-weight="400" text-anchor="start">&quot;5d2b…&quot;</text><text class="mono" x="268" y="226" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">// signature</text><text class="mono" x="62" y="252" font-size="12.5" fill="#e9f4f4" font-weight="400" text-anchor="start">}</text><rect x="505" y="88" width="495" height="210" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text class="mono" x="527" y="124" font-size="13" fill="#7bf0d0" font-weight="600" text-anchor="start">id</text><text x="600" y="124" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">smallest revocation unit: drop one, one device stops</text><text class="mono" x="527" y="158" font-size="13" fill="#7bf0d0" font-weight="600" text-anchor="start">room</text><text x="600" y="158" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">change a character and a stolen ticket stays out</text><text class="mono" x="527" y="192" font-size="13" fill="#7bf0d0" font-weight="600" text-anchor="start">exp</text><text x="600" y="192" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">2 minutes per reconnect, 12 hours once paired</text><text class="mono" x="527" y="226" font-size="13" fill="#7bf0d0" font-weight="600" text-anchor="start">mac</text><text x="600" y="226" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">without it the other three are free-form text</text><rect x="40" y="318" width="960" height="68" rx="14" fill="#081018" stroke="rgba(123,240,208,0.32)" stroke-width="1.2"/><text class="mono" xml:space="preserve" x="60" y="344" font-size="11.5" fill="#7bf0d0" font-weight="400" text-anchor="start">mac = base64url(HMAC-SHA256(secret, id + &quot;\0&quot; + room + &quot;\0&quot; + exp))</text><text class="mono" xml:space="preserve" x="60" y="365" font-size="11.5" fill="#7bf0d0" font-weight="400" text-anchor="start">Joining with \0 keeps &quot;a&quot;+&quot;bc&quot; and &quot;ab&quot;+&quot;c&quot; from ever sharing a mac. secret lives in the server env.</text>
</svg>
