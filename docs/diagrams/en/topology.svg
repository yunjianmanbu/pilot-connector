<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="384" viewBox="0 0 1040 384" role="img" aria-label="Blind relay: it routes rooms, it holds no keys">
<title>Blind relay: it routes rooms, it holds no keys</title>
<style>text{font-family:-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;}.mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,monospace;}</style>
<rect width="1040" height="384" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">Blind relay: it routes rooms, it holds no keys</text>
<text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">Pilot desktop ⇄ your relay ⇄ Pilot Link on the phone</text>
<rect x="40" y="100" width="250" height="150" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="62" y="130" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">PILOT DESKTOP</text><line x1="62" y1="144" x2="268" y2="144" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="62" y="176" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">holds the pairing secret</text><text x="62" y="198" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">opens a room, signs the ticket</text><rect x="385" y="100" width="250" height="150" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="407" y="130" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">YOUR RELAY</text><line x1="407" y1="144" x2="613" y2="144" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="407" y="176" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">forwards frames by room</text><text x="407" y="198" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">stores nothing, reads nothing</text><rect x="730" y="100" width="250" height="150" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="752" y="130" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">PILOT LINK</text><line x1="752" y1="144" x2="958" y2="144" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="752" y="176" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">same secret, from the QR code</text><text x="752" y="198" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">joins the room, shows the ticket</text><line x1="296" y1="164" x2="379" y2="164" stroke="#4fb6f0" stroke-width="1.4" stroke-dasharray="4 3"/><line x1="379" y1="164" x2="371" y2="160" stroke="#4fb6f0" stroke-width="1.4"/><line x1="379" y1="164" x2="371" y2="168" stroke="#4fb6f0" stroke-width="1.4"/><text class="mono" x="337.5" y="152" font-size="10" fill="#4fb6f0" font-weight="400" text-anchor="middle">WSS</text><text class="mono" x="337.5" y="182" font-size="10" fill="#708993" font-weight="400" text-anchor="middle">E2E</text><line x1="641" y1="164" x2="724" y2="164" stroke="#4fb6f0" stroke-width="1.4" stroke-dasharray="4 3"/><line x1="724" y1="164" x2="716" y2="160" stroke="#4fb6f0" stroke-width="1.4"/><line x1="724" y1="164" x2="716" y2="168" stroke="#4fb6f0" stroke-width="1.4"/><text class="mono" x="682.5" y="152" font-size="10" fill="#4fb6f0" font-weight="400" text-anchor="middle">WSS</text><text class="mono" x="682.5" y="182" font-size="10" fill="#708993" font-weight="400" text-anchor="middle">E2E</text><rect x="40" y="274" width="940" height="74" rx="14" fill="#081018" stroke="rgba(123,240,208,0.32)" stroke-width="1.2"/><text x="60" y="306" font-size="12.5" fill="#7bf0d0" font-weight="400" text-anchor="start">The project runs no public relay: deploy this one, or keep both ends on the same LAN.</text><text x="60" y="330" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">E2E = end-to-end AES-256-GCM, unreadable to the relay.</text>
</svg>
