<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="344" viewBox="0 0 1040 344" role="img" aria-label="中继的三种跑法">
<title>中继的三种跑法</title>
<style>text{font-family:-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;}.mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,monospace;}</style>
<rect width="1040" height="344" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">中继的三种跑法</text>
<text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">同一个程序、一份配置，准入规则三种形态完全一样</text>
<rect x="40" y="96" width="306" height="150" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="62" y="126" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">同一个局域网</text><line x1="62" y1="140" x2="324" y2="140" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="62" y="176" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">完全不启动中继进程，</text><text x="62" y="198" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">两端直接连</text><rect x="367" y="96" width="306" height="150" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="389" y="126" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">自己部署中继</text><line x1="389" y1="140" x2="651" y2="140" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="389" y="176" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">配好 PORT / BIND / WS_PATH，</text><text x="389" y="198" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">只按房间转发</text><rect x="694" y="96" width="306" height="150" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="716" y="126" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">放到 Nginx 后面</text><line x1="716" y1="140" x2="978" y2="140" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text x="716" y="176" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">一个 location 把 wss</text><text x="716" y="198" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">升级到 127.0.0.1:8789</text><rect x="40" y="268" width="960" height="56" rx="14" fill="#081018" stroke="rgba(123,240,208,0.32)" stroke-width="1.2"/><text x="60" y="302" font-size="12" fill="#7bf0d0" font-weight="400" text-anchor="start">三种跑法的准入完全一致：签名票据、一个房间一个所有权、单 IP 上限、脱敏日志。</text>
</svg>
