<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="346" viewBox="0 0 1040 346" role="img" aria-label="盲中继的两面：三个字段全由客户端自选">
<title>盲中继的两面：三个字段全由客户端自选</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#6f8b96"/>
</marker>
</defs>
<style>
text{font-family:undefined;}
.mono{font-family:"JetBrains Mono","Cascadia Code","SFMono-Regular",Consolas,monospace;}
</style>
<rect width="1040" height="346" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">盲中继的两面：三个字段全由客户端自选</text><text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">relay.hello { role, room, key } → relay.ready { role, protocol }</text><rect x="40" y="88" width="300" height="148" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="64" cy="115" r="4" fill="#f3bd5a"/><text x="78" y="120" font-size="14.5" fill="#e9f4f4" font-weight="600" text-anchor="start">客户端（桌面端 / 手机）</text><text x="62" y="156" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">room 由发起方自选</text><text x="62" y="179" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">key 由发起方自选</text><text x="62" y="202" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">role 由连接方声明</text><rect x="380" y="88" width="300" height="148" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="404" cy="115" r="4" fill="#4fb6f0"/><text x="418" y="120" font-size="14.5" fill="#e9f4f4" font-weight="600" text-anchor="start">中继（盲转发）</text><text x="402" y="156" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">唯一检查：同一房间号</text><text x="402" y="179" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">前后两次 key 必须一致</text><text x="402" y="202" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">不看内容、不落库</text><rect x="720" y="88" width="300" height="148" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="744" cy="115" r="4" fill="#ff6b6b"/><text x="758" y="120" font-size="14.5" fill="#e9f4f4" font-weight="600" text-anchor="start">陌生人</text><text x="742" y="156" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">知道 wss:// 地址就能连</text><text x="742" y="179" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">自开房间、自当主机</text><text x="742" y="202" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">带宽与端口算在部署者</text><path d="M342 162 L376 162" stroke="rgba(154,202,218,0.45)" stroke-width="1.4" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><path d="M682 162 L716 162" stroke="rgba(154,202,218,0.45)" stroke-width="1.4" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><rect x="40" y="258" width="960" height="64" rx="14" fill="#081018" stroke="rgba(243,189,90,0.35)" stroke-width="1.2"/><text x="60" y="283" font-size="13.5" fill="#f3bd5a" font-weight="400" text-anchor="start">代价：不看内容，就无法从内容判断「这条连接是不是我的用户」。</text><text x="60" y="306" font-size="13.5" fill="#f3bd5a" font-weight="400" text-anchor="start">缺的不是更聪明的中继，而是「被允许」这件事上的一个可验证凭据。</text>
</svg>
