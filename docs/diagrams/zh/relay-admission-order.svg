<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="456" viewBox="0 0 1040 456" role="img" aria-label="拒绝发生在分配资源之前">
<title>拒绝发生在分配资源之前</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#6f8b96"/>
</marker>
</defs>
<style>
text{font-family:undefined;}
.mono{font-family:"JetBrains Mono","Cascadia Code","SFMono-Regular",Consolas,monospace;}
</style>
<rect width="1040" height="456" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">拒绝发生在分配资源之前</text><text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">同一条出口：先发 relay.error，再以 4009 关闭连接</text><rect x="112" y="88" width="888" height="66" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="72" cy="121" r="16" fill="#081018" stroke="#708993" stroke-width="1.4"/><text class="mono" x="72" y="126" font-size="13" fill="#708993" font-weight="600" text-anchor="middle">1</text><text x="136" y="115" font-size="13.5" fill="#e9f4f4" font-weight="600" text-anchor="start">HTTP 101 升级完成</text><text x="136" y="137" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">之后没有状态码了，401 只对还没升级的请求有意义</text><rect x="112" y="168" width="888" height="66" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="72" cy="201" r="16" fill="#081018" stroke="#4fb6f0" stroke-width="1.4"/><text class="mono" x="72" y="206" font-size="13" fill="#4fb6f0" font-weight="600" text-anchor="middle">2</text><text x="136" y="195" font-size="13.5" fill="#e9f4f4" font-weight="600" text-anchor="start">relay.hello 到达</text><text x="136" y="217" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">能走到这一步的连接，此刻已经是 WebSocket</text><rect x="112" y="248" width="888" height="66" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="72" cy="281" r="16" fill="#081018" stroke="#ff6b6b" stroke-width="1.4"/><text class="mono" x="72" y="286" font-size="13" fill="#ff6b6b" font-weight="600" text-anchor="middle">3</text><text x="136" y="275" font-size="13.5" fill="#e9f4f4" font-weight="600" text-anchor="start">验签：纯计算，读环境变量里的 secret</text><text x="136" y="297" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">不通过 → relay.error + close(4009)，客户端共用一条展示路径</text><rect x="112" y="328" width="888" height="66" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><circle cx="72" cy="361" r="16" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="72" y="366" font-size="13" fill="#7bf0d0" font-weight="600" text-anchor="middle">4</text><text x="136" y="355" font-size="13.5" fill="#e9f4f4" font-weight="600" text-anchor="start">createRoom</text><text x="136" y="377" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">校验必须在此之前，晚一步就是先占一个房间名额再退掉</text><text x="40" y="432" font-size="13" fill="#f3bd5a" font-weight="400" text-anchor="start">守这个顺序的理由：拒绝得晚一步，容量计数就失去意义。</text>
</svg>
