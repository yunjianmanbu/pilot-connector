<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="454" viewBox="0 0 1040 454" role="img" aria-label="凭据藏在 URL 里：解析器也得跟着改">
<title>凭据藏在 URL 里：解析器也得跟着改</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#6f8b96"/>
</marker>
</defs>
<style>
text{font-family:undefined;}
.mono{font-family:"JetBrains Mono","Cascadia Code","SFMono-Regular",Consolas,monospace;}
</style>
<rect width="1040" height="454" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">凭据藏在 URL 里：解析器也得跟着改</text><text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">密钥放在 fragment 之后：不进请求行、不进 nginx 访问日志、不走 Referer</text><rect x="40" y="88" width="960" height="86" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text class="mono" x="62" y="118" font-size="13" fill="#9cb2bb" font-weight="400" text-anchor="start">wss://relay.example.com/c/9f3a2c7e18b46d05af3c72e95d1406b8</text><text class="mono" x="62" y="148" font-size="13" fill="#7bf0d0" font-weight="400" text-anchor="start">#k=home:7d1c9e04b2a8f356</text><rect x="40" y="202" width="460" height="152" rx="14" fill="#0b141c" stroke="rgba(255,107,107,0.32)" stroke-width="1.2"/><text x="62" y="230" font-size="13.5" fill="#ff6b6b" font-weight="600" text-anchor="start">旧路径：直接复用现有函数</text><text class="mono" x="62" y="256" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">normalizeRelayUrl(url)</text><text class="mono" x="62" y="278" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">  → url.hash = ''</text><text x="62" y="314" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">#k= 被静默丢掉，症状只是</text><text x="62" y="335" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">「一直连不上」，日志里干干净净</text><rect x="540" y="202" width="460" height="152" rx="14" fill="#0b141c" stroke="rgba(123,240,208,0.32)" stroke-width="1.2"/><text x="562" y="230" font-size="13.5" fill="#7bf0d0" font-weight="600" text-anchor="start">新路径：先摘 fragment 再复用</text><text class="mono" x="562" y="256" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">splitRelayAccess(raw)</text><text class="mono" x="562" y="278" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">  → { base, access }</text><text x="562" y="314" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">干净的 URL 交给原函数；</text><text x="562" y="335" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">解析失败必须报错，不能退回空串</text><rect x="40" y="376" width="960" height="56" rx="14" fill="#081018" stroke="rgba(243,189,90,0.35)" stroke-width="1.2"/><text x="60" y="400" font-size="13" fill="#f3bd5a" font-weight="400" text-anchor="start">通用经验：引入「字符串里藏着凭据」的配置格式时，第一件事不是写验签，</text><text x="60" y="422" font-size="13" fill="#f3bd5a" font-weight="400" text-anchor="start">而是找出所有会改写这个字符串的函数。</text>
</svg>
